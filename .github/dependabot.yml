version: 2

updates:
  # GitHub Actions in the root repo
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # npm deps in the root penguins-eggs package
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    ignore:
      # Major version bumps require manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── all-features integration submodules ─────────────────────────────────────
  # Each submodule that has a package.json gets its own npm entry so
  # Dependabot opens PRs against the submodule repo directly.

  - package-ecosystem: npm
    directory: /integrations/eggs-ai
    schedule:
      interval: weekly
      day: tuesday
    commit-message:
      prefix: "deps(eggs-ai)"
    labels:
      - dependencies
      - eggs-ai

  - package-ecosystem: npm
    directory: /integrations/eggs-gui
    schedule:
      interval: weekly
      day: tuesday
    commit-message:
      prefix: "deps(eggs-gui)"
    labels:
      - dependencies
      - eggs-gui

  - package-ecosystem: npm
    directory: /integrations/penguins-recovery
