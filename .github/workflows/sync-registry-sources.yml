name: Sync all-features

# Delegates to the canonical sync-registry-sources workflow in fork-sync-all.
# The implementation lives in:
#   Interested-Deving-1896/fork-sync-all  .github/workflows/sync-registry-sources.yml
#   Interested-Deving-1896/fork-sync-all  scripts/sync-registry-sources.sh
#
# This workflow triggers that one via workflow_dispatch, passing the registry
# file location in this repo. All sync logic, rate-limit handling, and
# upstream tracking is owned by fork-sync-all.

on:
  schedule:
    # 03:05 UTC daily — offset from sync-pieroproietti-forks (:05) and
    # sync-upstream-sources (01:30) so those have already run.
    - cron: "5 3 * * *"
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Sync only projects whose name contains this string"
        required: false
        default: ""
        type: string
      skip_core:
        description: "Skip syncing pieroproietti/penguins-eggs → all-features"
        required: false
        default: false
        type: boolean
      skip_projects:
        description: "Skip syncing the 14 integration projects"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Report without making changes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  delegate:
    name: Delegate to fork-sync-all
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger sync-registry-sources in fork-sync-all
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository_owner }}/fork-sync-all/actions/workflows/sync-registry-sources.yml/dispatches" \
            -d "$(python3 -c "
import json, sys
print(json.dumps({
  'ref': 'main',
  'inputs': {
    'registry_repo':   '${{ github.repository }}',
    'registry_branch': 'all-features',
    'registry_path':   'config/all-features-registry.json',
    'repo_filter':     '${{ inputs.repo_filter || '' }}',
    'skip_core':       '${{ inputs.skip_core || 'false' }}',
    'skip_projects':   '${{ inputs.skip_projects || 'false' }}',
    'dry_run':         '${{ inputs.dry_run || 'false' }}',
  }
}))
")"
          echo "Dispatched sync-registry-sources to ${{ github.repository_owner }}/fork-sync-all"
          echo "Monitor at: https://github.com/${{ github.repository_owner }}/fork-sync-all/actions/workflows/sync-registry-sources.yml"
