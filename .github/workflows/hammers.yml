name: Hammers — penguins-eggs-legacy

on:
  pull_request:
    branches: [master, main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: node:22-bookworm
            prepare: apt-get update && apt-get install -y build-essential dpkg-dev fakeroot gnupg apt-utils xz-utils sudo
          - distro: arch
            image: archlinux:latest
            prepare: pacman -Syu --noconfirm base-devel git nodejs npm pnpm rsync pacman-contrib sudo
          - distro: manjaro
            image: manjarolinux/base:latest
            prepare: pacman -Syu --noconfirm base-devel git nodejs npm pnpm rsync pacman-contrib sudo
          - distro: fedora
            image: fedora:42
            prepare: dnf install -y gcc-c++ make git tar gzip curl rpm-build nodejs npm pnpm
          - distro: el9
            image: almalinux:9
            prepare: dnf module enable -y nodejs:22 && dnf install -y gcc-c++ make git tar gzip curl-minimal rpm-build nodejs npm
          - distro: opensuse
            image: opensuse/tumbleweed:latest
            prepare: zypper --non-interactive refresh && zypper --non-interactive install gcc-c++ make git tar gzip curl rpm-build nodejs-devel npm pnpm
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare container
        run: ${{ matrix.prepare }}
      - uses: actions/checkout@v4
      - name: Install pnpm where not provided by the distribution
        if: matrix.distro == 'debian' || matrix.distro == 'el9'
        run: npm install -g pnpm@10
      - name: Build packages
        shell: bash
        run: bash scripts/hammers/build.sh "${{ matrix.distro }}"
      - uses: actions/upload-artifact@v4
        with:
          name: penguins-eggs-legacy-${{ matrix.distro }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: penguins-eggs-legacy-*
      - name: Prepare release assets
        run: |
          mkdir release-assets
          for distro in debian arch manjaro fedora el9 opensuse; do
            (cd "release-artifacts/penguins-eggs-legacy-$distro" && zip -r "../../release-assets/penguins-eggs-legacy-$distro.zip" .)
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "penguins-eggs-legacy $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
